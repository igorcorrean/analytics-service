name: 🚀 CI/CD DevSecOps - Analytics Service

on:
  push:
    branches: [ main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: analytics-service
  GITOPS_REPO: igorcorrean/togglemaster-gitops
  IMAGE_TAG: v1.0.0-${{ github.sha }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

jobs:
  # =========================================================================
  # JOB 1: Build, Test e Lint (Python 3.11)
  # =========================================================================
  build-and-test:
    name: 🧪 Build, Lint & Testes
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar Dependências e Ferramentas de Teste
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest pytest-cov

      - name: 🔍 Linter (Flake8)
        run: |
          # Interrompe o pipeline se houver erros críticos de sintaxe ou variáveis indefinidas
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Alerta de estilo e complexidade ciclomática
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: 🧪 Executar Testes Unitários com Cobertura
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term-missing || echo "Nenhum teste configurado ainda"

      - name: 📊 Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics-coverage
          path: coverage.xml
          retention-days: 7
          if-no-files-found: ignore

  # =========================================================================
  # JOB 2: Segurança (SAST & SCA) com Regra de Bloqueio Crítico
  # =========================================================================
  security-sast-sca:
    name: 🛡️ Security Scan (SAST & SCA)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # SAST: Varredura de vulnerabilidades no código Python
      - name: 🔎 SAST (Bandit)
        run: |
          pip install bandit
          # -lll: High severity | -iii: High confidence | -r: recursivo
          bandit -r . -lll -iii

      # SCA: Análise de vulnerabilidades em dependências do requirements.txt
      - name: 📦 SCA - Scan de Dependências (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1' # Bloqueia o pipeline se encontrar vulnerabilidade CRÍTICA

  # =========================================================================
  # JOB 3: Build da Imagem Docker, Container Scan & Push ECR
  # =========================================================================
  docker-build-push:
    name: 🐳 Docker Build, Scan & Push ECR
    runs-on: ubuntu-latest
    needs: security-sast-sca

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 🔑 Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 🔓 Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 1º Passo: Construir a imagem localmente (linux/amd64 para o EKS)
      - name: 🏗️ Docker Build Local
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ env.IMAGE_TAG }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .

      # 2º Passo: Scan da imagem Docker gerada antes do envio ao ECR
      - name: 🛡️ Container Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'

      # 3º Passo: Push para o ECR (apenas após aprovação do scanner)
      - name: 🚀 Push da Imagem para o ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ env.IMAGE_TAG }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

